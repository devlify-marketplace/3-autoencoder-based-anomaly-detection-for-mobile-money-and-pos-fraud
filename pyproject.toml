[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-autoencoder"
version = "1.0.0"
description = "Normal-only autoencoder benchmark for payment fraud anomaly detection"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24,<2.2",
  "pandas>=2.0,<3.0",
  "scikit-learn>=1.4,<2.0",
  "tensorflow>=2.15,<2.20",
  "matplotlib>=3.7,<4.0",
  "joblib>=1.3,<2.0",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "scipy>=1.11,<2.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
